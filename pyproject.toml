[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "garmin-mcp"
version = "0.1.0"
description = "MCP server exposing Garmin Connect data (activities, sleep, heart rate, body battery) as tools"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
keywords = ["mcp", "garmin", "garmin-connect", "llm", "ai-agents"]
dependencies = [
    "garminconnect",
    "curl_cffi",
    "fastmcp>=2.0.0",
    "google-api-python-client",
    "google-auth",
]

[project.scripts]
garmin-mcp = "server:main"
garmin-fetch = "scripts.fetch:main"
garmin-calendar-sync = "scripts.sync_calendar:main"

[tool.setuptools]
py-modules = ["server", "garmin_auth"]
packages = ["scripts"]
